name: Validate profile repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install XML tooling
        run: sudo apt-get update -y && sudo apt-get install -y libxml2-utils

      - name: Validate SVG files are well-formed XML
        run: |
          for f in $(find . -name '*.svg' -not -path './.git/*'); do
            xmllint --noout "$f" >/dev/null 2>&1 || { echo "❌ Invalid SVG: $f"; exit 1; }
          done
          echo "✅ All SVG files are well-formed XML"

      - name: Validate Markdown files are present and non-empty
        run: |
          test -s README.md || { echo "❌ README.md is missing or empty"; exit 1; }
          echo "✅ README.md is present"
